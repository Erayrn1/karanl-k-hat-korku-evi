<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Yönetimi - Admin Panel</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/pages.css">
    <style>
        .upload-section {
            background: rgba(255,255,255,.05);
            border: 2px dashed #e20f27;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }

        .upload-section.drag-over {
            background: rgba(226,15,39,.15);
            border-color: #ff3650;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            margin: 15px 0;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(180deg, #e20f27, #760918);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: transform .2s;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
        }

        .file-preview {
            margin-top: 15px;
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            display: none;
        }

        .file-preview.show {
            display: block;
        }

        .gallery-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.1);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .gallery-item-info {
            padding: 12px;
        }

        .gallery-item-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .gallery-item-actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: .85rem;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .delete-btn {
            background: #e20f27;
            color: #fff;
        }

        .delete-btn:hover {
            background: #760918;
        }

        .copy-btn {
            background: rgba(226,15,39,.2);
            color: #fff;
        }

        .copy-btn:hover {
            background: rgba(226,15,39,.35);
        }

        .success-msg {
            background: rgba(34,197,94,.15);
            border: 1px solid #22c55e;
            color: #22c55e;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
        }

        .success-msg.show {
            display: block;
        }

        .upload-progress {
            display: none;
            margin-top: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e20f27, #ff3650);
            width: 0%;
            transition: width .3s;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="navbar-brand">
                <h1>Admin Panel</h1>
            </div>
            <div class="navbar-menu">
                <a href="dashboard.html" class="nav-item">Anasayfa</a>
                <a href="gallery.html" class="nav-item active">Galeri</a>
                <a href="contact.html" class="nav-item">İletişim</a>
                <a href="content.html" class="nav-item">İçerik</a>
                <button onclick="logout()" class="nav-item logout-btn">Çıkış Yap</button>
            </div>
        </nav>

        <div class="dashboard-content">
            <div class="page-header">
                <h2>🖼️ Galeri Yönetimi</h2>
                <p>Korku evi fotoğraflarını yönetin</p>
            </div>

            <div class="gallery-manager">
                <div class="upload-section" id="uploadSection">
                    <h3>📁 Dosyadan Fotoğraf Yükle</h3>
                    <p style="color: #b9afb2; font-size: .9rem; margin: 10px 0;">
                        JPG, PNG, WebP formatında fotoğraf yükleyebilirsiniz (Max 5MB)
                    </p>
                    
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" accept="image/*" multiple>
                        <label for="fileInput" class="file-input-label">📤 Fotoğraf Seç</label>
                    </div>

                    <img id="filePreview" class="file-preview" alt="Ön izleme">
                    
                    <div class="upload-progress" id="uploadProgress">
                        <p style="font-size: .85rem;">Yükleniyor...</p>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>

                    <div class="success-msg" id="successMsg">✅ Fotoğraf başarıyla yüklendi!</div>
                </div>

                <div class="photos-list">
                    <h3>📸 Galeri Fotoğrafları (<span id="photoCount">0</span>)</h3>
                    <div id="galleryContainer" class="gallery-items">
                        <!-- Fotoğraflar burada gösterilecek -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/gallery.js"></script>
    <script>
        // Dosya yükleme sistemi
        const fileInput = document.getElementById('fileInput');
        const filePreview = document.getElementById('filePreview');
        const uploadProgress = document.getElementById('uploadProgress');
        const progressFill = document.getElementById('progressFill');
        const successMsg = document.getElementById('successMsg');
        const uploadSection = document.getElementById('uploadSection');
        const galleryContainer = document.getElementById('galleryContainer');

        // Base64 PNG 1x1 placeholder
        const PLACEHOLDER = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==';

        // Dosya yükleme
        fileInput.addEventListener('change', handleFileSelect);
        uploadSection.addEventListener('dragover', handleDragOver);
        uploadSection.addEventListener('dragleave', handleDragLeave);
        uploadSection.addEventListener('drop', handleDrop);

        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                uploadFiles(files);
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
            uploadSection.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            uploadSection.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            uploadSection.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                uploadFiles(files);
            }
        }

        function uploadFiles(files) {
            let uploaded = 0;

            for (let file of files) {
                if (!file.type.startsWith('image/')) {
                    alert('Lütfen yalnız resim dosyaları seçiniz!');
                    continue;
                }

                if (file.size > 5 * 1024 * 1024) {
                    alert(`${file.name} 5MB\'dan büyük!`);
                    continue;
                }

                const reader = new FileReader();
                reader.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = (e.loaded / e.total) * 100;
                        progressFill.style.width = percent + '%';
                    }
                };

                reader.onload = (e) => {
                    const base64 = e.target.result;
                    
                    // Base64 data URL olarak localStorage'a kaydet
                    let gallery = JSON.parse(localStorage.getItem('adminGallery') || '[]');
                    gallery.push({
                        id: Date.now() + Math.random(),
                        url: base64,
                        type: 'local',
                        uploadedAt: new Date().toLocaleString('tr-TR')
                    });
                    localStorage.setItem('adminGallery', JSON.stringify(gallery));

                    uploaded++;
                    if (uploaded === files.length) {
                        uploadProgress.style.display = 'none';
                        successMsg.classList.add('show');
                        setTimeout(() => successMsg.classList.remove('show'), 3000);
                        loadGallery();
                        fileInput.value = '';
                    }
                };

                reader.onerror = () => {
                    alert(`${file.name} okunamadı!`);
                };

                uploadProgress.style.display = 'block';
                progressFill.style.width = '0%';
                reader.readAsDataURL(file);
            }
        }

        function loadGallery() {
            const gallery = JSON.parse(localStorage.getItem('adminGallery') || '[]');
            galleryContainer.innerHTML = '';
            document.getElementById('photoCount').textContent = gallery.length;

            gallery.reverse().forEach(photo => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${photo.url}" alt="Galeri fotoğrafı">
                    <div class="gallery-item-info">
                        <small>${photo.uploadedAt}</small>
                        <div class="gallery-item-actions">
                            <button class="copy-btn" onclick="copyToClipboard('${photo.url.substring(0, 50)}...')">📋 URL Kopyala</button>
                            <button class="delete-btn" onclick="deletePhoto(${photo.id})">🗑️ Sil</button>
                        </div>
                    </div>
                `;
                galleryContainer.appendChild(div);
            });
        }

        function deletePhoto(id) {
            if (confirm('Bu fotoğrafı silmek istediğinize emin misiniz?')) {
                let gallery = JSON.parse(localStorage.getItem('adminGallery') || '[]');
                gallery = gallery.filter(p => p.id !== id);
                localStorage.setItem('adminGallery', JSON.stringify(gallery));
                loadGallery();
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert('URL kopyalandı!');
        }

        // Sayfa yüklendiğinde galeriyi göster
        window.addEventListener('load', loadGallery);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayarlar - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@400;500;600;700&family=Nosifer&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div class="admin-shell">
    <aside class="sidebar" aria-label="Admin menüsü">
        <div class="sidebar-head">
            <p class="logo-mark">KH</p>
            <div>
                <h1 class="logo-title">Karanlık Hat</h1>
                <p class="logo-subtitle">Admin Panel</p>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="../dashboard.html" class="nav-link" data-nav-link><span>🏠</span><span>Ana Sayfa</span></a>
            <a href="gallery.html" class="nav-link" data-nav-link><span>🖼️</span><span>Galeri</span></a>
            <a href="content.html" class="nav-link" data-nav-link><span>📝</span><span>İçerik</span></a>
            <a href="contact.html" class="nav-link" data-nav-link><span>📞</span><span>İletişim</span></a>
            <a href="settings.html" class="nav-link active" data-nav-link><span>⚙️</span><span>Ayarlar</span></a>
        </nav>
    </aside>

    <div class="main-wrap">
        <header class="topbar">
            <div>
                <p class="page-eyebrow">Sistem Ayarları</p>
                <h2 class="page-title">Genel Ayarlar ve Yedekleme</h2>
            </div>
            <button class="btn btn-ghost" id="logoutBtn" type="button">Çıkış</button>
        </header>

        <main class="page-grid two-col">
            <section class="form-card">
                <form id="settingsForm" novalidate>
                    <div class="form-group"><label for="siteTitle">Site Başlığı</label><input id="siteTitle" required></div>
                    <div class="form-group"><label for="metaDescription">Meta Açıklama</label><textarea id="metaDescription" required></textarea></div>
                    <div class="form-group"><label for="analyticsId">Analytics ID</label><input id="analyticsId" placeholder="G-XXXXXXX"></div>
                    <div class="form-group">
                        <label for="theme">Renk Teması</label>
                        <select id="theme">
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                        </select>
                    </div>
                    <div class="footer-actions">
                        <button class="btn" type="submit">Kaydet</button>
                        <button class="btn btn-secondary" type="button" id="exportBtn">Yedekle (Export)</button>
                    </div>
                </form>

                <div class="inline-actions" style="margin-top:12px;">
                    <input id="importFile" type="file" accept="application/json" aria-label="Yedek dosyası seç">
                    <button class="btn btn-ghost" type="button" id="importBtn">İçe Aktar</button>
                </div>
            </section>

            <section class="list-card">
                <h3>Şifre Değiştir</h3>
                <p class="muted">İlk kurulumdan sonra varsayılan şifreyi hemen güncelleyin.</p>
                <form id="passwordForm" novalidate>
                    <div class="form-group"><label for="currentPassword">Mevcut Şifre</label><input id="currentPassword" type="password" required></div>
                    <div class="form-group"><label for="newPassword">Yeni Şifre</label><input id="newPassword" type="password" minlength="6" required></div>
                    <div class="form-group"><label for="newPasswordAgain">Yeni Şifre (Tekrar)</label><input id="newPasswordAgain" type="password" minlength="6" required></div>
                    <button class="btn" type="submit">Şifreyi Güncelle</button>
                </form>
            </section>
        </main>
    </div>
</div>

<div class="toast" id="globalToast" role="status" aria-live="polite"></div>

<script src="../js/app.js"></script>
<script>
(() => {
    AdminApp.initLayout();

    const settingsKey = AdminApp.keys.settings;
    const settingsForm = document.getElementById('settingsForm');
    const passwordForm = document.getElementById('passwordForm');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');

    const load = () => {
        const settings = AdminApp.getStorage(settingsKey, {});
        document.getElementById('siteTitle').value = settings.siteTitle || 'Karanlık Hat Korku Evi';
        document.getElementById('metaDescription').value = settings.metaDescription || 'Karanlık Hat Korku Evi resmi sitesi';
        document.getElementById('analyticsId').value = settings.analyticsId || '';
        document.getElementById('theme').value = settings.theme || 'dark';
    };

    settingsForm.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!AdminApp.validateForm(settingsForm)) return;

        const data = {
            siteTitle: document.getElementById('siteTitle').value.trim(),
            metaDescription: document.getElementById('metaDescription').value.trim(),
            analyticsId: document.getElementById('analyticsId').value.trim(),
            theme: document.getElementById('theme').value
        };

        AdminApp.setStorage(settingsKey, data);
        AdminApp.applyTheme();
        AdminApp.addActivity('Sistem ayarları güncellendi');
        AdminApp.showToast('Ayarlar kaydedildi.');
    });

    exportBtn.addEventListener('click', () => {
        AdminApp.exportBackup();
    });

    importBtn.addEventListener('click', async () => {
        const file = importFile.files[0];
        if (!file) {
            AdminApp.showToast('Önce yedek dosyası seçin.', 'error');
            return;
        }

        try {
            await AdminApp.importBackup(file);
            load();
        } catch {
            AdminApp.showToast('Yedek dosyası okunamadı.', 'error');
        }
    });

    passwordForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!AdminApp.validateForm(passwordForm)) return;

        const current = document.getElementById('currentPassword').value;
        const next = document.getElementById('newPassword').value;
        const repeat = document.getElementById('newPasswordAgain').value;
        const credentials = AdminApp.getCredentials();
        const currentHash = await AdminApp.hashPassword(current);

        if (currentHash !== credentials.passwordHash) {
            AdminApp.showToast('Mevcut şifre hatalı.', 'error');
            return;
        }

        if (next !== repeat) {
            AdminApp.showToast('Yeni şifreler eşleşmiyor.', 'error');
            return;
        }

        if (next.length < 6) {
            AdminApp.showToast('Yeni şifre en az 6 karakter olmalı.', 'error');
            return;
        }

        await AdminApp.updatePassword(next);
        passwordForm.reset();
        AdminApp.showToast('Şifre başarıyla güncellendi.');
    });

    load();
})();
</script>
</body>
</html>

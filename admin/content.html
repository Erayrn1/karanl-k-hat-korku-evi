<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İçerik Yönetimi - Admin Panel</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="navbar-brand">
                <h1>Admin Panel</h1>
            </div>
            <div class="navbar-menu">
                <a href="dashboard.html" class="nav-item">Anasayfa</a>
                <a href="gallery.html" class="nav-item">Galeri</a>
                <a href="contact.html" class="nav-item">İletişim</a>
                <a href="content.html" class="nav-item active">İçerik</a>
                <button onclick="logout()" class="nav-item logout-btn">Çıkış Yap</button>
            </div>
        </nav>

        <div class="dashboard-content">
            <div class="page-header">
                <h2>📝 İçerik Yönetimi</h2>
                <p>Site metinlerini ve açıklamaları güncelleyin</p>
            </div>

            <div class="content-manager">
                <form id="contentForm" class="content-form">
                    <div class="form-section">
                        <h3>Ana Başlık</h3>
                        
                        <div class="form-group">
                            <label>Site Başlığı</label>
                            <input type="text" id="siteTitle" placeholder="Karanlık Hat Korku Evi">
                        </div>

                        <div class="form-group">
                            <label>Ana Slogan</label>
                            <textarea id="mainSlogan" placeholder="Gerçeğin kabusa dönüştüğü yer..."></textarea>
                        </div>

                        <div class="form-group">
                            <label>Sayfa Açıklaması</label>
                            <textarea id="siteDescription" placeholder="Korku evi hakkında açıklama"></textarea>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Seviye Bilgileri</h3>
                        
                        <div id="levelsContainer" class="levels-container">
                            <!-- Seviye bilgileri dinamik olarak eklenir -->
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Özellikler</h3>
                        
                        <div class="form-group">
                            <label>Özellik 1</label>
                            <input type="text" id="feature1" placeholder="Gerçek oyuncular">
                        </div>

                        <div class="form-group">
                            <label>Özellik 2</label>
                            <input type="text" id="feature2" placeholder="Sürükleyici senaryo">
                        </div>

                        <div class="form-group">
                            <label>Özellik 3</label>
                            <input type="text" id="feature3" placeholder="Özel efektler">
                        </div>
                    </div>

                    <button type="submit" class="save-btn">Değişiklikleri Kaydet</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/content.js"></script>
</body>
</html>
